        <section id="tab-diarization" class="tab-pane">
          <div class="view-header">
            <div>
              <h1 class="view-title">Batch Speaker Diarization Studio</h1>
              <p class="view-subtitle">Transcribe speaker turns, intervals, and RTTM annotations across entire speech datasets.</p>
            </div>
          </div>

          <div class="form-panel-centered">
            <form id="form-batch-diarization" class="form-vertical">
              <div class="form-item">
                <label class="form-label" for="diar-dataset-select">1. Select Target Speech Dataset</label>
                <select id="diar-dataset-select" class="form-select select-dataset-list">
                  <option value="Speech Corpus">Speech Corpus</option>
                  <option value="Default">Default</option>
                  <option value="all">Entire Library</option>
                </select>
              </div>

              <!-- Diarization Backend Selection Cards -->
              <div class="form-item">
                <label class="form-label">2. Diarization Neural Architecture</label>
                <div class="model-cards-grid">
                  <label class="model-pro-card active">
                    <input type="radio" name="diar-backend-radio" value="sortformer" checked class="hidden-radio">
                    <div class="pro-card-top">
                      <span class="pro-card-title">Sortformer</span>
                      <span class="badge-sota-glow">Recommended</span>
                    </div>
                    <p class="pro-card-desc">Next-gen multi-speaker transformer. Instantaneous streaming inference with no authentication required.</p>
                    <div class="pro-card-specs">
                      <span class="spec-chip">Multi-Speaker</span>
                      <span class="spec-chip">Zero Token Required</span>
                      <span class="spec-chip">Ultra-Fast</span>
                    </div>
                  </label>

                  <label class="model-pro-card">
                    <input type="radio" name="diar-backend-radio" value="clustering" class="hidden-radio">
                    <div class="pro-card-top">
                      <span class="pro-card-title">NeMo Clustering</span>
                      <span class="badge-spec-glow">Cascaded</span>
                    </div>
                    <p class="pro-card-desc">MarbleNet VAD + TitaNet embeddings + spectral clustering. Uses min/max speaker bounds when provided.</p>
                    <div class="pro-card-specs">
                      <span class="spec-chip">Multi-Scale TitaNet</span>
                      <span class="spec-chip">Zero Token Required</span>
                    </div>
                  </label>

                  <label class="model-pro-card">
                    <input type="radio" name="diar-backend-radio" value="3d_speaker" class="hidden-radio">
                    <div class="pro-card-top">
                      <span class="pro-card-title">3D-Speaker</span>
                      <span class="badge-spec-glow">ModelScope</span>
                    </div>
                    <p class="pro-card-desc">ModelScope speakerlab pipeline: FSMN VAD + CAM++ embeddings + spectral clustering.</p>
                    <div class="pro-card-specs">
                      <span class="spec-chip">campplus + fsmn-vad</span>
                      <span class="spec-chip">Zero Token Required</span>
                    </div>
                  </label>

                  <label class="model-pro-card">
                    <input type="radio" name="diar-backend-radio" value="pyannote_community" class="hidden-radio">
                    <div class="pro-card-top">
                      <span class="pro-card-title">Pyannote Community-1</span>
                      <span class="badge-spec-glow">Community SOTA</span>
                    </div>
                    <p class="pro-card-desc">Successor of Pyannote 3.1 (pyannote/speaker-diarization-community-1). Exclusive diarization with high accuracy.</p>
                    <div class="pro-card-specs">
                      <span class="spec-chip">speaker-diarization-community-1</span>
                      <span class="spec-chip">Requires HF Token</span>
                    </div>
                  </label>

                  <label class="model-pro-card">
                    <input type="radio" name="diar-backend-radio" value="pyannote_31" class="hidden-radio">
                    <div class="pro-card-top">
                      <span class="pro-card-title">Pyannote Audio 3.1</span>
                      <span class="badge-spec-glow">Precision Classic</span>
                    </div>
                    <p class="pro-card-desc">Gold-standard neural diarization pipeline with overlapping speech handling and RTTM export.</p>
                    <div class="pro-card-specs">
                      <span class="spec-chip">speaker-diarization-3.1</span>
                      <span class="spec-chip">Overlap Handling</span>
                      <span class="spec-chip">Requires HF Token</span>
                    </div>
                  </label>
                </div>
                <input type="hidden" id="diar-backend" value="sortformer">
              </div>

              <div class="form-row">
                <div class="form-item flex-1">
                  <label class="form-label" for="diar-min-spk">Min Speakers (Optional)</label>
                  <input type="number" id="diar-min-spk" class="form-input" min="1" max="10" placeholder="Auto">
                </div>
                <div class="form-item flex-1">
                  <label class="form-label" for="diar-max-spk">Max Speakers (Optional)</label>
                  <input type="number" id="diar-max-spk" class="form-input" min="1" max="20" placeholder="Auto">
                </div>
                <div class="form-item flex-1">
                  <label class="form-label" for="diar-device">Compute Device</label>
                  <select id="diar-device" class="form-select">
                    <option value="cuda">CUDA GPU</option>
                    <option value="cpu">CPU Only</option>
                  </select>
                </div>
              </div>

              <div class="form-item">
                <div class="label-with-tool">
                  <label class="form-label" for="diar-hf-token">HuggingFace Token (Required only for Pyannote)</label>
                  <button type="button" class="btn btn-ghost btn-xs" id="btn-toggle-token-vis">Show</button>
                </div>
                <input type="password" id="diar-hf-token" class="form-input font-mono" placeholder="hf_xxxxxxxxxxxxxxxxxxxx">
              </div>

              <button type="submit" class="btn btn-primary btn-lg" id="btn-submit-diarization">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span>Launch Batch Diarization Job</span>
              </button>
            </form>
          </div>
        </section>
