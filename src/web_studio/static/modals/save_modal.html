<div id="modal-save-to" class="modal-backdrop hidden">
      <div class="modal-card modal-md">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <span class="modal-badge-icon">💾</span>
            <div>
              <h3 class="modal-title">Save Audio Object To Disk</h3>
              <p class="modal-subtitle">Writes audio artifact and companion <code>{stem}.json</code> sidecar metadata</p>
            </div>
          </div>
          <button class="btn-close-modal" id="btn-close-save-modal" title="Close (Esc)">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Target Directory Presets:</label>
            <div class="save-presets-list" id="save-target-presets">
              <button type="button" class="save-preset-chip active" data-folder="benchmarks/separation/sources/speech">
                <span class="preset-chip-icon">🎯</span>
                <span class="preset-chip-title">Benchmark Speech</span>
                <span class="preset-chip-sub">benchmarks/separation/sources/speech/</span>
              </button>
              <button type="button" class="save-preset-chip" data-folder="benchmarks/separation/sources/music">
                <span class="preset-chip-icon">🎵</span>
                <span class="preset-chip-title">Benchmark Music</span>
                <span class="preset-chip-sub">benchmarks/separation/sources/music/</span>
              </button>
              <button type="button" class="save-preset-chip" data-folder="benchmarks/separation/sources/cuts">
                <span class="preset-chip-icon">✂️</span>
                <span class="preset-chip-title">Benchmark Cuts</span>
                <span class="preset-chip-sub">benchmarks/separation/sources/cuts/</span>
              </button>
              <button type="button" class="save-preset-chip" data-folder="data">
                <span class="preset-chip-icon">📁</span>
                <span class="preset-chip-title">Data Directory</span>
                <span class="preset-chip-sub">data/</span>
              </button>
              <button type="button" class="save-preset-chip" data-folder="temp">
                <span class="preset-chip-icon">⚡</span>
                <span class="preset-chip-title">Temp Directory</span>
                <span class="preset-chip-sub">temp/</span>
              </button>
            </div>
          </div>

          <div class="form-group" style="margin-top: 1rem;">
            <label class="form-label" for="input-save-path">Destination File Path:</label>
            <input type="text" id="input-save-path" class="text-input font-mono" placeholder="e.g. benchmarks/separation/sources/speech/my_audio.wav">
            <p class="input-hint">Calls <code>Audio.save_to()</code> — copies file, updates path identity, and writes sidecar JSON.</p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="btn-cancel-save">Cancel</button>
          <button class="btn btn-primary" id="btn-confirm-save">Save File & Metadata</button>
        </div>
      </div>
    </div>

    <!-- Sample Library Modal -->
