<div id="modal-task-queue" class="modal-backdrop hidden">
      <div class="modal-card modal-lg queue-modal-card">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <span class="modal-badge-icon">⚡</span>
            <div>
              <h3 class="modal-title">Shared GPU &amp; Task Queue</h3>
              <p class="modal-subtitle" id="queue-modal-subtitle">Live unified compute workloads across SonicStudio &amp; SonicPipeline</p>
            </div>
          </div>
          <div class="modal-header-actions">
            <button class="btn btn-sm btn-secondary" id="btn-refresh-queue-modal" title="Refresh task status">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              <span>Refresh</span>
            </button>
            <button class="btn btn-sm btn-secondary" id="btn-clear-queue-finished" title="Clear finished and cancelled tasks">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              <span>Clear Done</span>
            </button>
            <button class="btn-close-modal" id="btn-close-queue-modal" title="Close (Esc)">&times;</button>
          </div>
        </div>

        <!-- Shared GPU Telemetry Ribbon -->
        <div class="queue-gpu-ribbon" id="queue-gpu-ribbon">
          <div class="gpu-ribbon-item">
            <span class="gpu-ribbon-icon">🖥️</span>
            <span class="gpu-ribbon-label">Compute:</span>
            <span class="gpu-ribbon-val" id="queue-gpu-name">Detecting...</span>
          </div>
          <div class="gpu-ribbon-divider"></div>
          <div class="gpu-ribbon-item">
            <span class="gpu-ribbon-label">GPU Load:</span>
            <span class="gpu-ribbon-val font-mono" id="queue-gpu-load">--</span>
          </div>
          <div class="gpu-ribbon-divider"></div>
          <div class="gpu-ribbon-item">
            <span class="gpu-ribbon-label">VRAM:</span>
            <span class="gpu-ribbon-val font-mono" id="queue-gpu-vram">-- / -- MB</span>
          </div>
          <div class="gpu-ribbon-divider"></div>
          <div class="gpu-ribbon-item">
            <span class="gpu-ribbon-label">Power Draw:</span>
            <span class="gpu-ribbon-val font-mono text-amber" id="queue-gpu-power">-- W</span>
          </div>
          <div class="gpu-ribbon-divider"></div>
          <div class="gpu-ribbon-item">
            <span class="gpu-ribbon-label">Shared Allocation:</span>
            <span class="gpu-ribbon-val font-mono text-cyan" id="queue-active-split">Studio: 0 • Pipeline: 0</span>
          </div>
        </div>

        <!-- Multi-GPU Individual Cards (shown when 2+ GPUs detected) -->
        <div class="gpu-devices-grid" id="queue-gpu-devices-grid" style="display: none;"></div>

        <div class="queue-modal-stats-bar">
          <div class="queue-stat-pill" id="stat-pill-running">
            <span class="stat-dot dot-pulse"></span>
            <span class="stat-num" id="queue-stat-running">0</span>
            <span class="stat-name">Running</span>
          </div>
          <div class="queue-stat-pill" id="stat-pill-queued">
            <span class="stat-num" id="queue-stat-queued">0</span>
            <span class="stat-name">Queued</span>
          </div>
          <div class="queue-stat-pill" id="stat-pill-completed">
            <span class="stat-num" id="queue-stat-completed">0</span>
            <span class="stat-name">Completed</span>
          </div>
          <div class="queue-stat-pill" id="stat-pill-failed">
            <span class="stat-num" id="queue-stat-failed">0</span>
            <span class="stat-name">Failed</span>
          </div>
          <div class="queue-stat-divider"></div>
          <div class="queue-modal-filters" id="queue-modal-filters">
            <button class="pill-btn active" data-filter="all">All (Shared)</button>
            <button class="pill-btn" data-filter="active">Active &amp; Queued</button>
            <button class="pill-btn" data-filter="studio">🎙️ Studio</button>
            <button class="pill-btn" data-filter="pipeline">⚡ Pipeline</button>
            <button class="pill-btn" data-filter="completed">Completed</button>
            <button class="pill-btn" data-filter="failed">Failed</button>
          </div>
        </div>

        <div class="modal-body queue-modal-body">
          <div id="studio-queue-task-list" class="queue-task-list">
            <!-- Dynamically populated from shared queue -->
          </div>
        </div>

        <div class="modal-footer queue-modal-footer">
          <a href="/pipeline/#tab-queue" class="btn btn-secondary btn-sm queue-switch-link" title="Open SonicPipeline Batch Job Queue">
            <span>⚡ Open SonicPipeline Batch Queue</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          </a>
          <button class="btn btn-secondary" id="btn-cancel-queue-modal">Close</button>
        </div>
      </div>
    </div>

    <!-- Keyboard Shortcuts Modal -->
