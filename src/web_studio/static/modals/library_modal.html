<div id="modal-library" class="modal-backdrop hidden">
      <div class="modal-card modal-lg">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <span class="modal-badge-icon">📁</span>
            <div>
              <h3 class="modal-title">Project Sample Library</h3>
              <p class="modal-subtitle">Browse, preview, and load audio files from data/ and .data/ directories</p>
            </div>
          </div>
          <button class="btn-close-modal" id="btn-close-library-modal" title="Close (Esc)" aria-label="Close modal">&times;</button>
        </div>
        
        <div class="modal-filter-bar">
          <input type="text" id="library-modal-search" class="input-text library-search-input" placeholder="🔍 Search samples by name, folder, format...">
          <div class="category-pills" id="library-modal-categories">
            <button class="pill-btn active" data-category="all">All</button>
            <button class="pill-btn" data-category="speech">Speech</button>
            <button class="pill-btn" data-category="music">Music</button>
            <button class="pill-btn" data-category="cuts">Cuts</button>
            <button class="pill-btn" data-category="stems">Stems</button>
            <button class="pill-btn" data-category="downloads">Ingest</button>
            <button class="pill-btn" data-category="pipeline">Pipeline</button>
            <button class="pill-btn" data-category="temp">Temp</button>
          </div>
        </div>

        <div class="modal-body">
          <div class="library-modal-list" id="modal-library-items"></div>
        </div>

        <div class="modal-footer">
          <span class="modal-footer-hint font-mono text-muted" id="library-modal-count">0 files available</span>
          <button class="btn btn-secondary" id="btn-cancel-library-modal">Close</button>
        </div>
      </div>
    </div>

    <!-- Studio & Pipeline Shared Task Queue Inspector Modal -->
