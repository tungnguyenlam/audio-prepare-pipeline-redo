    <footer class="master-player">
      <audio id="global-audio-element" preload="auto"></audio>
      
      <div class="player-left">
        <div class="track-avatar" id="player-avatar">🎵</div>
        <div class="track-details">
          <span class="track-title" id="player-track-title">No Audio Loaded</span>
          <span class="track-sub" id="player-track-sub">Select or load an audio track to play</span>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button class="btn-ctrl" id="btn-player-skip-back" title="Replay 5s">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path><text x="9" y="16" font-size="8" font-family="sans-serif">5</text></svg>
          </button>

          <button class="btn-ctrl" id="btn-player-start" title="Go to the start">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="4" x2="5" y2="20"></line><polygon points="19 4 9 12 19 20 19 4"></polygon></svg>
          </button>
          
          <button class="btn-ctrl btn-play-master" id="btn-player-play-pause" title="Play/Pause">
            <svg id="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="icon-pause" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>

          <button class="btn-ctrl" id="btn-player-skip-fwd" title="Forward 5s">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path><text x="9" y="16" font-size="8" font-family="sans-serif">5</text></svg>
          </button>

          <button class="btn-ctrl" id="btn-player-loop" title="Toggle Loop">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          </button>
        </div>

        <div class="player-scrub-row">
          <span class="time-label" id="player-time-current">00:00</span>
          <div class="scrub-track-wrapper" id="player-scrub-wrapper">
            <div class="scrub-track">
              <div class="scrub-progress" id="player-scrub-progress"></div>
              <div class="scrub-handle" id="player-scrub-handle"></div>
            </div>
          </div>
          <span class="time-label" id="player-time-total" title="Click to toggle remaining time">00:00</span>
        </div>
      </div>

      <div class="player-right">
        <!-- Speed selector -->
        <div class="speed-selector">
          <select id="player-speed-select" class="select-mini" title="Playback Speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1.0" selected>1.0×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2.0">2.0×</option>
          </select>
        </div>

        <!-- Volume control -->
        <div class="volume-group">
          <button class="btn-ctrl-sm" id="btn-player-mute" title="Mute/Unmute">
            <svg id="icon-vol" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            <svg id="icon-vol-mute" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
          </button>
          <input type="range" id="player-volume-slider" class="range-slider range-slider-sm" min="0" max="1" step="0.02" value="1">
        </div>
      </div>
    </footer>
