[project]
name = "audio-crawler-pipeline"
version = "0.1.0"
description = "YouTube Audio Crawler & Preprocessing Pipeline for TTS / ASR"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "yt-dlp>=2025.1.15",
    "aiofiles>=24.1.0",
    "pydantic>=2.10.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "demucs>=4.1.0",
    "melband-roformer-infer>=0.1.5",
    "deepfilternet>=0.5.6",
]

[project.optional-dependencies]
separation = [
    "demucs>=4.1.0",
    "melband-roformer-infer>=0.1.5",
    "deepfilternet>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
